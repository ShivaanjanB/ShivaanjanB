# Draws the profile infographics with lowlighter/metrics and commits the SVGs to this repo.
# Needs a repository secret METRICS_TOKEN: a classic personal access token with no scopes
# (both plugins below only read public data).
name: Metrics
on:
  schedule: [{cron: "0 6 * * *"}]  # daily, 06:00 UTC
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Most-used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: Europe/London
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          # Notebook bytes are mostly saved cell output, not code.
          plugin_languages_ignored: jupyter notebook

      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          base: ""
          config_timezone: Europe/London
          plugin_habits: yes
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: no
